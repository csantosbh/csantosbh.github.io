baseURL = 'https://csantosbh.github.io/'
languageCode = 'en-us'
title = 'Red Math Book'
theme = 'PaperMod'

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['$$', '$$']]
          inline = [['$', '$']]

[params]
  defaultTheme = "auto"
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = false
  ShowWordCount = false
  ShowFullTextinRSS = true
  ShowToc = true
  TocOpen = true
  ShowFullContentinRSS = false
  ShowFullContentinList = false
  ShowSummary = false
  ShowMenu = false
  ShowDate = false
  math = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
